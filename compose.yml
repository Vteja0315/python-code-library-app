---
services:
  db:
    build: ./database/
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork2

  auth_service:
    build: ./auth/
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork2
    depends_on:
      - db
    

  book_service:
    build: ./book/
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork2
    depends_on:
      - db
      
  borrow_service:
    build: ./borrow/
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork2
    depends_on:
      - db

  frontend:
    build: ./
    deploy:
      replicas: 2
    ports:
      - "5000:5000"
    networks:
      - mynetwork1
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork1:
    driver: overlay
  mynetwork2:
    driver: overlay
